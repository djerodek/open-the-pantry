<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to eat?</title>
<meta name="description" content="Pick a recipe at random">
<link rel="manifest" href="/picker-static/manifest.json">
<link rel="icon" href="/picker-static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/picker-static/icons/icon-192.png">
<meta name="theme-color" content="#6B7A5E">
<link rel="stylesheet" href="/picker-static/picker.css">
</head>
<body>
<header class="picker-header">
  <h1 class="picker-title">What to eat?</h1>
  <div class="picker-header-actions">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang-choice="en" lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang-choice="fr" lang="fr" aria-pressed="false">FR</button>
    </div>
    <a class="pantry-link" id="pantry-link" href="/">Open the Pantry</a>
  </div>
</header>

<main class="picker-main" id="picker-main">
  <!-- The stage: the shuffle and the picked recipe, first on the page. -->
  <section class="stage" id="action" aria-label="What to eat?" hidden>
    <p class="stage-note" id="result-note" hidden></p>
    <div class="stage-card-slot" id="result-card-slot"></div>
    <p class="stage-message" id="result-message" hidden></p>
    <button type="button" class="pick-button" id="pick-button">Pick one</button>
    <p class="stage-count" id="result-count" hidden></p>
  </section>

  <!-- The choices: all visible, quieter than the stage. -->
  <section class="choices" id="choices-panel" aria-labelledby="choices-heading" hidden>
    <div class="choices-head">
      <h2 class="choices-heading" id="choices-heading">Choices</h2>
      <button type="button" class="text-button" id="clear-button">Clear</button>
    </div>
    <div id="choices"></div>
  </section>

  <p class="picker-loading" id="choices-loading">Loading...</p>
  <p class="picker-empty" id="empty-library" hidden>
    No recipes yet. <a id="empty-library-link" href="/">Add some in Open the Pantry.</a>
  </p>
  <p class="picker-error" id="load-error" hidden>
    <span id="load-error-text"></span>
    <button type="button" class="btn-secondary" id="load-retry">Try again</button>
  </p>
</main>

<!-- The recipe, read-only, over the page. -->
<div class="reader-overlay" id="reader-overlay" hidden>
  <div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" tabindex="-1">
    <div class="reader-bar">
      <button type="button" class="reader-close" id="reader-close" aria-label="Close recipe">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="reader-print" id="reader-print" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Print</span>
      </button>
    </div>
    <div class="reader-body" id="reader-body"></div>
  </div>
</div>

<!-- What a screen reader hears after a pick: the final recipe only, never
     the titles the shuffle rolls through. -->
<div class="visually-hidden" id="pick-status" role="status" aria-live="polite"></div>

<script src="/js/i18n.js"></script>
<script src="/picker-static/picker.js"></script>
</body>
</html>
