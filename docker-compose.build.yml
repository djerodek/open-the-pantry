services:
  open-the-pantry:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: open-the-pantry
    ports:
      - "8090:8090"
      - "8443:8443"   # HTTPS, once set up in Settings -> HTTPS
      # What to eat?, once switched on in Settings. If 8091 is taken on this
      # machine, change the left side (e.g. "9000:8091") and set
      # RECIPE_APP_PICKER_PUBLIC_PORT to that number under environment:.
      - "8091:8091"
    env_file:         # optional DNS host login for Settings -> HTTPS
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Optional resource limits. Measured worst case: about 3.4 GB with three
    # big scans being OCR'd at once (the app runs at most three, Settings ->
    # Learning's training counting as one); idle is
    # about 160 MB. Over the limit, Docker stops the container and
    # restart: brings it back.
    # mem_limit: 4g
    # cpus: 2
    # pids_limit: 256
    environment:
      # Your time zone, so the daily email scan runs at the hour you set.
      # Change to yours, e.g. America/Toronto, Europe/Paris.
      TZ: "UTC"
    #   # Optional; Settings can create encryption.key instead. See README.
    #   RECIPE_APP_ENCRYPTION_KEY: "paste-generated-key-here"
    #   RECIPE_APP_API_KEY: "choose-a-long-random-string"
