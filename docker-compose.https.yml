# Optional: HTTPS on your own network, with a real certificate, for DNS
# hosts other than cPanel. With cPanel, use Settings -> HTTPS in the app
# instead; it needs no extra containers.
#
# Not used unless you turn it on -- nothing here runs with the plain
# `docker compose up -d`. Setup is in the README, "Optional: HTTPS on your
# network". In short: copy https.env.example to .env next to your
# docker-compose.yml, fill it in, then `docker compose up -d`.
#
# Why: browsers only offer some features on https:// pages, notably the
# real "keep screen awake" (Screen Wake Lock API). Over plain http:// the
# app uses a fallback instead.
#
# How: Traefik (a reverse proxy) gets a Let's Encrypt certificate for a
# name in a domain you own, proving ownership with a DNS record it creates
# through your DNS host's API (the DNS-01 challenge). Nothing has to be
# reachable from the internet, and the name can point at a private LAN
# address. Every value below comes from .env; if one is missing, docker
# compose stops and names it.
services:
  open-the-pantry:
    environment:
      # The app refuses host names it doesn't know (see README, "Other
      # websites can't use the app through your browser").
      RECIPE_APP_ALLOWED_HOSTS: ${PANTRY_DOMAIN:?Set PANTRY_DOMAIN in .env (see https.env.example)}
    labels:
      open-the-pantry.https: "true"
      traefik.enable: "true"
      traefik.http.routers.open-the-pantry.rule: Host(`${PANTRY_DOMAIN}`)
      traefik.http.routers.open-the-pantry.entrypoints: websecure
      traefik.http.routers.open-the-pantry.tls.certresolver: letsencrypt
      traefik.http.services.open-the-pantry.loadbalancer.server.port: "8090"

  open-the-pantry-https:
    image: traefik:v3
    container_name: open-the-pantry-https
    restart: unless-stopped
    depends_on:
      - open-the-pantry
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Only this app's container, even if other containers on the host
      # carry Traefik labels meant for a different proxy.
      - --providers.docker.constraints=Label(`open-the-pantry.https`,`true`)
      - --entrypoints.websecure.address=:8443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env (see https.env.example)}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:?Set ACME_DNS_PROVIDER in .env (see https.env.example)}
      # Check the challenge record on public resolvers, not the LAN's DNS.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    # The DNS host's API credentials (CPANEL_*, CLOUDFLARE_*...) are read
    # from .env by Traefik itself.
    env_file:
      - .env
    ports:
      - "${PANTRY_HTTPS_PORT:-443}:8443"
    volumes:
      # Read-only: Traefik reads which containers to route to. It only
      # acts on the one labelled open-the-pantry.https above.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The certificate and Let's Encrypt account, kept across restarts.
      - ./letsencrypt:/letsencrypt
