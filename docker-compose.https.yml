# Optional: HTTPS on your own network, with a real certificate, for DNS
# hosts other than cPanel. With cPanel, use Settings -> HTTPS in the app
# instead; it needs no extra containers.
#
# Not used unless you turn it on -- nothing here runs with the plain
# `docker compose up -d`. Setup is in the README, "Optional: HTTPS on your
# network". In short: copy https.env.example to .env and traefik.env.example
# to traefik.env, next to your docker-compose.yml, fill both in, then
# `docker compose up -d`.
#
# Why: browsers only offer some features on https:// pages, notably "keep
# screen awake" (Screen Wake Lock API).
#
# How: Traefik (a reverse proxy) gets a Let's Encrypt certificate for a
# name in a domain you own, proving ownership with a DNS record it creates
# through your DNS host's API (the DNS-01 challenge). Nothing has to be
# reachable from the internet, and the name can point at a private LAN
# address. Every value below comes from .env; if one is missing, docker
# compose stops and names it.
services:
  open-the-pantry:
    environment:
      # The app refuses host names it doesn't know (see README, "Other
      # websites can't use the app through your browser").
      RECIPE_APP_ALLOWED_HOSTS: ${PANTRY_DOMAIN:?Set PANTRY_DOMAIN in .env (see https.env.example)}
      # Believe the visitor's address and https:// as Traefik reports them,
      # but only from Traefik's fixed address below. Without this the app
      # sees every visitor as Traefik: one shared request limit and one
      # shared wrong-password count for everybody. Never "*" while 8090 is
      # also published: anyone could then claim any address.
      FORWARDED_ALLOW_IPS: ${PANTRY_TRAEFIK_IP:-172.31.250.10}
      # The secure address. The settings password and the sections behind
      # it then open only through Traefik, never over the plain http://
      # port 8090 below, where the password could be read on the network.
      RECIPE_APP_HTTPS_URL: https://${PANTRY_DOMAIN}:${PANTRY_HTTPS_PORT:-443}
    labels:
      open-the-pantry.https: "true"
      traefik.enable: "true"
      traefik.http.routers.open-the-pantry.rule: Host(`${PANTRY_DOMAIN}`)
      traefik.http.routers.open-the-pantry.entrypoints: websecure
      traefik.http.routers.open-the-pantry.tls.certresolver: letsencrypt
      traefik.http.services.open-the-pantry.loadbalancer.server.port: "8090"

  open-the-pantry-https:
    image: traefik:v3
    container_name: open-the-pantry-https
    restart: unless-stopped
    depends_on:
      - open-the-pantry
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Only this app's container, even if other containers on the host
      # carry Traefik labels meant for a different proxy.
      - --providers.docker.constraints=Label(`open-the-pantry.https`,`true`)
      - --entrypoints.websecure.address=:8443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env (see https.env.example)}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:?Set ACME_DNS_PROVIDER in .env (see https.env.example)}
      # Check the challenge record on public resolvers, not the LAN's DNS.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    # The DNS host's API credentials (CF_DNS_API_TOKEN, OVH_*...), from
    # traefik.env. Only Traefik reads that file: the app container gets
    # .env, which holds none of them.
    env_file:
      - traefik.env
    networks:
      default:
        ipv4_address: ${PANTRY_TRAEFIK_IP:-172.31.250.10}
    ports:
      - "${PANTRY_HTTPS_PORT:-443}:8443"
    volumes:
      # Traefik reads which containers to route to here. ":ro" only stops
      # the socket file itself being replaced; it does NOT make the Docker
      # API read-only, so anything that takes over Traefik controls Docker
      # (root on the host). To limit that, put a socket proxy that allows
      # only container listing in front of it (README, "Optional: HTTPS on
      # your network").
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The certificate and Let's Encrypt account, kept across restarts.
      - ./letsencrypt:/letsencrypt

# A fixed address range, so Traefik's address (trusted above) never
# changes. Change PANTRY_NETWORK_SUBNET and PANTRY_TRAEFIK_IP in .env if
# the range is already used on this machine. Switching an existing install
# to this needs one `docker compose down` first.
networks:
  default:
    ipam:
      config:
        - subnet: ${PANTRY_NETWORK_SUBNET:-172.31.250.0/24}
