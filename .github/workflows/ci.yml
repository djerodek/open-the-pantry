name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-osd tzdata libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libharfbuzz-subset0 libffi-dev shared-mime-info fonts-liberation

      - name: Install Python dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Run tests
        run: cd backend && python -m pytest tests/ -v

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        # Fails the build. It used to end in `|| true`, so 167 advisories
        # accumulated unseen across the libraries that parse uploads, email
        # and downloaded pages. If an advisory can't be fixed yet, ignore it
        # explicitly with --ignore-vuln <ID> and a comment saying why.

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed -- just confirms it builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
