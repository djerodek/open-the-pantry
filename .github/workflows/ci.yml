name: CI

# Tests, dependency audit, a test build, then (pushes to main only) the
# published image. The image used to be built by a separate workflow that
# ran on every push whatever these jobs gave (Claude review round 13; a
# failing push still published :main and :latest). Actions are pinned to a
# commit, with the tag in a comment: the Docker Hub token passes through
# them; each runs on Node 24 (the Node 20 ones were being forced onto it,
# with a warning on every run).
#
# Also weekly and on demand: a dependency advisory published between pushes
# fails the audit without waiting for the next push (dnspython, 0136), and
# the image is rebuilt with the newest base image, Debian packages, trusted
# roots and certifi. Published only if everything passes, as for a push.
# GitHub turns scheduled runs off after 60 days without a commit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 0"    # Sundays 07:23 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-osd tesseract-ocr-fra tzdata libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libharfbuzz-subset0 libffi-dev shared-mime-info fonts-liberation

      - name: Install Python dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Run tests
        run: cd backend && python -m pytest tests/ -v

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        # Fails the build. It used to end in `|| true`, so 167 advisories
        # accumulated unseen across the libraries that parse uploads, email
        # and downloaded pages. If an advisory can't be fixed yet, ignore it
        # explicitly with --ignore-vuln <ID> and a comment saying why.

  browser:
    # The pages in headless Chromium against a real server (backend/
    # tests_browser): JavaScript errors, CSP violations, and the page bugs
    # the server tests can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-osd tesseract-ocr-fra tzdata libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libharfbuzz-subset0 libffi-dev shared-mime-info fonts-liberation

      - name: Install Python dependencies and Chromium
        run: |
          pip install -r backend/requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: cd backend && python -m pytest tests_browser -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed -- just confirms it builds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          pull: true      # the newest python:3.13-slim, not a cached one
          push: false

  publish:
    # Only once the tests, the audit, the browser tests and the test build
    # have passed, and only for main (a push, the weekly run, or Run
    # workflow), never for a pull request.
    runs-on: ubuntu-latest
    needs: [test, browser, docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/open-the-pantry
          # Without an explicit tag list, metadata-action's defaults only
          # publish "latest" on a git TAG push (flavor.latest=auto), never on
          # a push to main -- so the image had a :main tag and no :latest at
          # all, and any compose file saying :latest failed to pull. These
          # rules publish both: :latest and :main track the default branch.
          # (Version tags aren't published: the workflow runs on main only.)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Docker Hub's Overview doesn't follow the repository on its own. This
      # copies DOCKERHUB.md into it on pushes to main. Docker Hub only accepts
      # description updates from a token with the Read, Write, Delete scope;
      # with a narrower DOCKERHUB_TOKEN this step fails by itself and the image
      # above is still published (see README, "Publishing your own build").
      - name: Update Docker Hub overview
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/open-the-pantry
          readme-filepath: ./DOCKERHUB.md
          short-description: "Self-hosted recipe manager PWA: URL, PDF, photo and email ingest; English/French."
