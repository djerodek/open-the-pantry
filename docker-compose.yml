services:
  open-the-pantry:
    # :main follows every change. To stay on a build you've tested, use a
    # release tag instead, e.g. djerodek/open-the-pantry:1.0.0 (README,
    # "Deployment notes").
    image: djerodek/open-the-pantry:main
    container_name: open-the-pantry
    ports:
      - "8090:8090"
      # HTTPS, once set up in Settings -> HTTPS (nothing listens here until
      # then). To use https://name with no port, change the left side to
      # 443 if nothing else on this machine uses it.
      - "8443:8443"
    # Optional: your DNS host's API login for Settings -> HTTPS, in a file
    # named .env next to this one (see README, "Optional: HTTPS on your
    # network"). Ignored if the file doesn't exist.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data     # SQLite DB + uploaded images/PDFs, persists across updates
    restart: unless-stopped
    # Optional resource limits. Measured worst case: about 3.4 GB with three
    # big scans being OCR'd at once (the app runs at most three); idle is
    # about 160 MB. Over the limit, Docker stops the container and
    # restart: brings it back.
    # mem_limit: 4g
    # cpus: 2
    # pids_limit: 256
    environment:
      # Your time zone, so the daily email scan runs at the hour you set.
      # Change to yours, e.g. America/Toronto, Europe/Paris.
      TZ: "UTC"
    #   # Optional. Email ingest can create its own key from Settings
    #   # (stored as encryption.key in ./data). Set this instead only if you
    #   # want the key kept outside the data folder. Generate one with:
    #   #   docker exec open-the-pantry python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    #   # If set, it overrides encryption.key.
    #   RECIPE_APP_ENCRYPTION_KEY: "paste-generated-key-here"
    #
    #   # Only if you reach the app by a host name with a dot in it that
    #   # isn't .local/.lan/.home.arpa (e.g. behind a reverse proxy). See
    #   # README "Other websites can't use the app through your browser".
    #   RECIPE_APP_ALLOWED_HOSTS: "pantry.example.com"
    #
    #   # Strongly recommended if you enable email ingest -- see the README's
    #   # security notes. Requires a client or reverse proxy that sends the
    #   # X-API-Key header.
    #   RECIPE_APP_API_KEY: "choose-a-long-random-string"
