services:
  open-the-pantry:
    image: djerodek/open-the-pantry:main
    container_name: open-the-pantry
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data     # SQLite DB + uploaded images/PDFs, persists across updates
    restart: unless-stopped
    # environment:
    #   # Only needed if you use the optional email-ingest feature. Generate with:
    #   #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    #   # Back this up separately from ./data -- losing it means re-entering
    #   # email credentials (nothing else is affected).
    #   RECIPE_APP_ENCRYPTION_KEY: "paste-generated-key-here"
    #
    #   # Strongly recommended if you enable email ingest -- see the README's
    #   # security notes. Requires a client or reverse proxy that sends the
    #   # X-API-Key header.
    #   RECIPE_APP_API_KEY: "choose-a-long-random-string"
